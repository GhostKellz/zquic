name: ZQUIC CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ZIG_GLOBAL_CACHE_DIR: /tmp/zig-global-cache

jobs:
  lint:
    name: "Lint & API Checks"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cache on tmpfs
        run: |
          rm -rf .zig-cache zig-out /home/runner/.cache/zig
          mkdir -p /tmp/zig-local-cache /tmp/zig-global-cache
          ln -sfn /tmp/zig-local-cache .zig-cache
          echo "Checking /tmp filesystem:"
          df -T /tmp
          ls -la .zig-cache

      - name: Show Zig version
        run: zig version

      - name: Fetch dependencies
        run: zig build --fetch

      - name: Format check
        run: |
          set -euo pipefail
          zig fmt --check src/
          zig fmt --check examples/
          if [ -d tests ]; then
            zig fmt --check tests/
          fi


  unit-tests:
    name: "Unit & fuzz tests"
    runs-on: self-hosted
    timeout-minutes: 20
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cache on tmpfs
        run: |
          rm -rf .zig-cache zig-out /home/runner/.cache/zig
          mkdir -p /tmp/zig-local-cache /tmp/zig-global-cache
          ln -sfn /tmp/zig-local-cache .zig-cache

      - name: Show Zig version
        run: zig version

      - name: Fetch dependencies
        run: zig build --fetch

      - name: Run unit tests
        run: |
          set -euo pipefail
          zig build test

      - name: Run integration tests
        run: |
          set -euo pipefail
          zig build integration-tests

  integration:
    name: "Integration smoke"
    runs-on: self-hosted
    timeout-minutes: 10
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            /home/runner/.cache/zig
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig') }}
          restore-keys: zig-${{ runner.os }}-

      - name: Set Zig cache dir
        run: echo "ZIG_GLOBAL_CACHE_DIR=/home/runner/.cache/zig" >> $GITHUB_ENV

      - name: Show Zig version
        run: zig version

      - name: Skip integration build (already covered in unit job)
        run: echo "Integration build skipped in CI"

  release-build:
    name: "Release Build"
    runs-on: self-hosted
    needs: [unit-tests, integration]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cache on tmpfs
        run: |
          rm -rf .zig-cache zig-out /home/runner/.cache/zig
          mkdir -p /tmp/zig-local-cache /tmp/zig-global-cache
          ln -sfn /tmp/zig-local-cache .zig-cache

      - name: Show Zig version
        run: zig version

      - name: Build Release via dev script
        run: |
          set -euo pipefail
          ./dev/build_release.sh

      - name: Archive Release Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zquic-release-${{ github.sha }}
          path: |
            zig-out/bin/
            zig-out/lib/
          retention-days: 30
