name: ZQUIC CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: "Lint & API Checks"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ..zig-cache
            zig-out
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig', 'tests/**/*.zig', 'examples/**/*.zig') }}

      - name: Show Zig version
        run: zig version

      - name: Clean stale cache
        run: rm -rf ..zig-cache zig-out

      - name: Format check
        run: |
          set -euo pipefail
          zig fmt --check src/
          zig fmt --check examples/
          if [ -d tests ]; then
            zig fmt --check tests/
          fi

      - name: Deprecated API sweep
        run: |
          set -euo pipefail
          ./dev/check_api.sh

  unit-tests:
    name: "Unit & fuzz tests"
    runs-on: self-hosted
    timeout-minutes: 20
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig', 'tests/**/*.zig', 'examples/**/*.zig') }}

      - name: Show Zig version
        run: zig version

      - name: Run dev/test.sh
        run: |
          set -euo pipefail
          ./dev/test.sh

  integration:
    name: "Integration smoke"
    runs-on: self-hosted
    timeout-minutes: 15
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig', 'tests/**/*.zig', 'examples/**/*.zig') }}

      - name: Show Zig version
        run: zig version

      - name: Run smoke tests
        run: |
          set -euo pipefail
          ./dev/smoke_test.sh

      - name: Run local test sweep
        run: |
          set -euo pipefail
          ./dev/test_local.sh

  release-build:
    name: "Release Build"
    runs-on: self-hosted
    needs: [unit-tests, integration]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Zig version
        run: zig version

      - name: Build Release via dev script
        run: |
          set -euo pipefail
          ./dev/build_release.sh

      - name: Archive Release Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zquic-release-${{ github.sha }}
          path: |
            zig-out/bin/
            zig-out/lib/
          retention-days: 30