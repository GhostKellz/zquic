name: ZQUIC CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Use per-job workspace-local Zig caches to avoid cross-job interference
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

jobs:
  lint:
    name: "Lint & API Checks"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig cache dirs
        run: |
          set -euo pipefail
          rm -rf .zig-cache zig-out .zig-global-cache
          mkdir -p .zig-cache .zig-global-cache
          echo "ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache" >> "$GITHUB_ENV"

      - name: Show Zig version
        run: zig version

      - name: Fetch dependencies
        run: zig build --fetch

      - name: Format check
        run: |
          set -euo pipefail
          zig fmt --check src/
          zig fmt --check examples/
          if [ -d tests ]; then
            zig fmt --check tests/
          fi


  unit-tests:
    name: "Unit & fuzz tests"
    runs-on: self-hosted
    timeout-minutes: 20
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig cache dirs
        run: |
          set -euo pipefail
          rm -rf .zig-cache zig-out .zig-global-cache
          mkdir -p .zig-cache .zig-global-cache
          echo "ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache" >> "$GITHUB_ENV"

      - name: Show Zig version
        run: zig version

      - name: Fetch dependencies
        run: zig build --fetch

      - name: Run unit tests
        run: |
          set -euo pipefail
          zig build test

      - name: Run integration tests
        run: |
          set -euo pipefail
          zig build integration-tests

  integration:
    name: "Integration smoke"
    runs-on: self-hosted
    timeout-minutes: 10
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            .zig-global-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Setup Zig cache dirs
        run: |
          set -euo pipefail
          rm -rf .zig-cache zig-out .zig-global-cache
          mkdir -p .zig-cache .zig-global-cache
          echo "ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache" >> "$GITHUB_ENV"

      - name: Show Zig version
        run: zig version

      - name: Skip integration build (already covered in unit job)
        run: echo "Integration build skipped in CI"

  release-build:
    name: "Release Build"
    runs-on: self-hosted
    needs: [unit-tests, integration]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig cache dirs
        run: |
          set -euo pipefail
          rm -rf .zig-cache zig-out .zig-global-cache
          mkdir -p .zig-cache .zig-global-cache
          echo "ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache" >> "$GITHUB_ENV"

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            .zig-global-cache
          key: zig-release-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-release-${{ runner.os }}-

      - name: Show Zig version
        run: zig version

      - name: Fetch dependencies
        run: zig build --fetch

      - name: Build Release via dev script
        run: |
          set -euo pipefail
          ./dev/build_release.sh -Dexamples=false -Dservices=false -Dvpn=false -Ddoq=false -Dhttp3=false -Dpost-quantum=false

      - name: Archive Release Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zquic-release-${{ github.sha }}
          path: |
            zig-out/bin/
            zig-out/lib/
          retention-days: 30
