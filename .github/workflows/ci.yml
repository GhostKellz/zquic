name: ZQUIC CI - Simple & Reliable

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 🏗️ Basic build and test
  build-and-test:
    name: "Build & Test"
    runs-on: [self-hosted, nvidia, gpu, zig, palladium]
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Environment
        run: |
          echo "🔧 Environment check:"
          zig version
          pwd
          ls -la

      - name: Clean Previous Build
        run: |
          echo "🧹 Cleaning previous builds..."
          rm -rf zig-out zig-cache || true

      - name: Build ZQUIC
        run: |
          echo "🔨 Building ZQUIC..."
          zig build
          
          echo "📦 Build results:"
          if [ -d "zig-out/bin" ]; then
            ls -la zig-out/bin/
          else
            echo "No zig-out/bin directory found"
          fi

      - name: Run Tests
        run: |
          echo "🧪 Running tests..."
          zig build test

      - name: Basic Functionality Check
        run: |
          echo "✅ Basic functionality check..."
          if [ -d "zig-out/bin" ]; then
            for bin in zig-out/bin/*; do
              if [ -x "$bin" ]; then
                echo "✓ $(basename $bin) exists and is executable"
                # Just check if it runs without erroring out immediately
                timeout 2s "$bin" --version 2>/dev/null || echo "  - Binary responds to basic invocation"
              fi
            done
          else
            echo "No binaries to test"
          fi

      - name: Build Size Report
        run: |
          echo "📊 Build size report:"
          if [ -d "zig-out" ]; then
            du -sh zig-out/
            if [ -d "zig-out/bin" ]; then
              echo "Binary sizes:"
              du -h zig-out/bin/* 2>/dev/null || echo "No binaries found"
            fi
          fi

  # 🔍 Optional release build (only on main branch)
  release-build:
    name: "Release Build"
    runs-on: [self-hosted, nvidia, gpu, zig, palladium]
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release
        run: |
          echo "🚀 Building release version..."
          zig build -Doptimize=ReleaseFast
          
          echo "📦 Release build results:"
          if [ -d "zig-out/bin" ]; then
            ls -lah zig-out/bin/
          fi

      - name: Archive Release Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zquic-release-${{ github.sha }}
          path: |
            zig-out/bin/
            zig-out/lib/
          retention-days: 30